<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ASCENSION CLIMB — PUTYAHEARTINIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #0a0a0a;
    overflow: hidden;
    font-family: 'Outfit', sans-serif;
    color: #fff;
  }
  header {
    position: fixed; top: 0; left: 0; right: 0;
    height: 56px;
    background: #0a0a0a;
    border-bottom: 1px solid #222;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px;
    z-index: 100;
  }
  .back-link {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px; letter-spacing: 1px;
    color: #888; text-decoration: none;
    transition: color 0.2s;
  }
  .back-link:hover { color: #fff; }
  .game-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px; letter-spacing: 3px; color: #fff;
  }
  .score-display {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 15px; letter-spacing: 2px; color: #C9A84C;
  }
  #gameWrap {
    position: fixed;
    top: 56px; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; justify-content: center;
    background: #0a0a0a;
  }
  #gameCanvas {
    display: block;
    touch-action: none;
  }
</style>
</head>
<body>
<header>
  <a href="/" class="back-link">← PUTYAHEARTINIT</a>
  <div class="game-title">ASCENSION CLIMB</div>
  <div class="score-display">HEIGHT: <span id="scoreVal">0</span>m</div>
</header>
<div id="gameWrap">
  <canvas id="gameCanvas"></canvas>
</div>
<script>
(function () {
  'use strict';

  // Constants
  const LOGICAL_W = 400;
  const LOGICAL_H = 700;
  const GRAVITY = 0.45;
  const MAX_FALL = 14;
  const JUMP_FORCE = -14;
  const H_SPEED = 160;
  const PLAT_W_NORMAL = 80;
  const PLAT_H = 10;
  const PLAT_START_W = 200;
  const PLAT_COUNT = 15;
  const PLAT_SPACING_MIN = 80;
  const PLAT_SPACING_MAX = 110;
  const PX_PER_METER = 20;

  // Heart type thresholds
  const HEART_TYPES = [
    { min: 0,   max: 49,       name: 'THE SURVIVOR',  quote: 'You kept going. That\'s already rare.' },
    { min: 50,  max: 149,      name: 'THE WARRIOR',   quote: 'You fight through. The world needs fighters.' },
    { min: 150, max: 299,      name: 'THE CREATOR',   quote: 'You find ways when there are none.' },
    { min: 300, max: Infinity, name: 'THE VISIONARY', quote: 'Your ceiling is the sky.' },
  ];

  // Realm zones
  const REALMS = [
    { name: 'EARTH',  minM: 0,    maxM: 299  },
    { name: 'NEON',   minM: 300,  maxM: 599  },
    { name: 'COSMIC', minM: 600,  maxM: 999  },
    { name: 'VOID',   minM: 1000, maxM: Infinity },
  ];

  // Canvas
  const canvas  = document.getElementById('gameCanvas');
  const ctx     = canvas.getContext('2d');
  const wrap    = document.getElementById('gameWrap');
  const scoreEl = document.getElementById('scoreVal');

  let scale  = 1;
  let state  = 'start';
  let lastTs = 0;

  function resize() {
    const avW = wrap.clientWidth;
    const avH = wrap.clientHeight;
    scale = Math.min(avW / LOGICAL_W, avH / LOGICAL_H);
    canvas.width  = LOGICAL_W;
    canvas.height = LOGICAL_H;
    canvas.style.width  = (LOGICAL_W * scale) + 'px';
    canvas.style.height = (LOGICAL_H * scale) + 'px';
  }
  resize();
  window.addEventListener('resize', resize);

  // Player
  const player = { x: 0, y: 0, vy: 0, vx: 0, w: 16, h: 24 };

  // Camera (top of canvas in world coords; Y increases downward)
  let cameraY  = 0;
  let heightPx = 0; // max pixels climbed above start position
  let bestM    = parseInt(localStorage.getItem('ac_best') || '0', 10);

  let platforms = [];

  // Controls
  const keys = { left: false, right: false };
  const activeTouches = new Map();

  // Particles
  let dustParticles  = [];
  let neonOrbs       = [];
  let starParticles  = [];
  let voidShapes     = [];

  // Realm flash text
  let realmFlash = { name: '', alpha: 0, lastRealm: '' };

  let pulseT   = 0;
  let flickerT = 0;

  // Dead overlay hit zones (logical coords)
  let deadBtn  = null; // {x,y,w,h}
  let quizLink = null; // {x,y,w,h}

  // Platform factory
  function makePlatform(worldY, x, w, moving) {
    const speed = moving
      ? (50 + Math.random() * 30) * (Math.random() < 0.5 ? 1 : -1)
      : 0;
    return { x, y: worldY, w, h: PLAT_H, moving, speed,
             minX: 10, maxX: LOGICAL_W - w - 10 };
  }

  function initPlatforms() {
    platforms = [];
    // Start platform
    platforms.push(makePlatform(620, (LOGICAL_W - PLAT_START_W) / 2, PLAT_START_W, false));
    let lastY = 620;
    for (let i = 1; i < PLAT_COUNT; i++) {
      const gap  = PLAT_SPACING_MIN + Math.random() * (PLAT_SPACING_MAX - PLAT_SPACING_MIN);
      lastY -= gap;
      const mov  = Math.random() < 0.3;
      const x    = 10 + Math.random() * (LOGICAL_W - PLAT_W_NORMAL - 20);
      platforms.push(makePlatform(lastY, x, PLAT_W_NORMAL, mov));
    }
  }

  function getHighestPlatY() {
    let min = Infinity;
    for (const p of platforms) if (p.y < min) min = p.y;
    return min;
  }

  function recyclePlatforms() {
    const cullY = cameraY + LOGICAL_H + 200;
    for (let i = 0; i < platforms.length; i++) {
      if (platforms[i].y > cullY) {
        const gap  = PLAT_SPACING_MIN + Math.random() * (PLAT_SPACING_MAX - PLAT_SPACING_MIN);
        const newY = getHighestPlatY() - gap;
        const mov  = Math.random() < 0.3;
        const x    = 10 + Math.random() * (LOGICAL_W - PLAT_W_NORMAL - 20);
        platforms[i] = makePlatform(newY, x, PLAT_W_NORMAL, mov);
      }
    }
  }

  // Particle init
  function initDust() {
    dustParticles = [];
    for (let i = 0; i < 6; i++) {
      dustParticles.push({
        x: Math.random() * LOGICAL_W,
        y: Math.random() * LOGICAL_H,
        r: 1 + Math.random() * 2,
        speed: 0.2 + Math.random() * 0.3,
        alpha: 0.1 + Math.random() * 0.2,
      });
    }
  }
  function initNeonOrbs() {
    neonOrbs = [];
    for (let i = 0; i < 3; i++) {
      neonOrbs.push({
        x: Math.random() * LOGICAL_W,
        y: Math.random() * LOGICAL_H,
        r: 8 + Math.random() * 12,
        color: i % 2 === 0 ? 'purple' : 'cyan',
        dx: (Math.random() - 0.5) * 40,
        dy: (Math.random() - 0.5) * 40,
        alpha: 0.25 + Math.random() * 0.25,
      });
    }
  }
  function initStars() {
    starParticles = [];
    for (let i = 0; i < 40; i++) {
      starParticles.push({
        x: Math.random() * LOGICAL_W,
        y: Math.random() * LOGICAL_H,
        r: 0.5 + Math.random() * 1.5,
        alpha: Math.random(),
        dAlpha: (Math.random() - 0.5) * 0.025,
      });
    }
  }
  function initVoidShapes() {
    voidShapes = [];
    for (let i = 0; i < 8; i++) {
      voidShapes.push({
        x: Math.random() * LOGICAL_W,
        y: Math.random() * LOGICAL_H,
        size: 20 + Math.random() * 60,
        angle: Math.random() * Math.PI * 2,
        dAngle: (Math.random() - 0.5) * 0.008,
        alpha: 0.04 + Math.random() * 0.06,
      });
    }
  }

  function initGame() {
    initPlatforms();
    initDust();
    initNeonOrbs();
    initStars();
    initVoidShapes();

    const sp   = platforms[0];
    player.x   = LOGICAL_W / 2 - player.w / 2;
    player.y   = sp.y - player.h;
    player.vy  = 0;
    player.vx  = 0;

    cameraY  = player.y - LOGICAL_H + 80;
    heightPx = 0;

    realmFlash = { name: '', alpha: 0, lastRealm: 'EARTH' };
    deadBtn    = null;
    quizLink   = null;
  }

  function pxToMeters(px) { return Math.floor(px / PX_PER_METER); }

  function getRealmForMeters(m) {
    for (const r of REALMS) if (m >= r.minM && m <= r.maxM) return r;
    return REALMS[REALMS.length - 1];
  }
  function getHeartType(m) {
    for (const h of HEART_TYPES) if (m >= h.min && m <= h.max) return h;
    return HEART_TYPES[HEART_TYPES.length - 1];
  }

  // Update
  function update(dt) {
    if (state !== 'playing') return;
    flickerT += dt * 8;

    // Horizontal
    const targetVX = keys.left ? -H_SPEED : keys.right ? H_SPEED : 0;
    if (targetVX !== 0) {
      player.vx = targetVX;
    } else {
      const decel = 900 * dt;
      if (player.vx > 0) player.vx = Math.max(0, player.vx - decel);
      else if (player.vx < 0) player.vx = Math.min(0, player.vx + decel);
    }

    player.x += player.vx * dt;
    if (player.x + player.w < 0) player.x = LOGICAL_W;
    if (player.x > LOGICAL_W)    player.x = -player.w;

    // Gravity
    player.vy += GRAVITY;
    if (player.vy > MAX_FALL) player.vy = MAX_FALL;
    player.y += player.vy;

    // Platform collision (falling only)
    if (player.vy >= 0) {
      for (const p of platforms) {
        if (
          player.x + player.w > p.x &&
          player.x < p.x + p.w &&
          player.y + player.h >= p.y &&
          player.y + player.h <= p.y + p.h + MAX_FALL + 2 &&
          player.y < p.y
        ) {
          player.y  = p.y - player.h;
          player.vy = JUMP_FORCE;
          break;
        }
      }
    }

    // Move platforms
    for (const p of platforms) {
      if (p.moving) {
        p.x += p.speed * dt;
        if (p.x < p.minX) { p.x = p.minX; p.speed = Math.abs(p.speed); }
        if (p.x > p.maxX) { p.x = p.maxX; p.speed = -Math.abs(p.speed); }
      }
    }

    // Camera scroll
    const trigY = cameraY + LOGICAL_H * 0.4;
    if (player.y < trigY) cameraY = player.y - LOGICAL_H * 0.4;

    // Height tracking
    const startWorldY = 620;
    const climbed = startWorldY - player.y;
    if (climbed > heightPx) heightPx = climbed;

    const meters = pxToMeters(Math.max(0, heightPx));
    scoreEl.textContent = meters;
    if (meters > bestM) { bestM = meters; localStorage.setItem('ac_best', bestM); }

    // Realm flash
    const realm = getRealmForMeters(meters);
    if (realm.name !== realmFlash.lastRealm) {
      realmFlash.name      = realm.name;
      realmFlash.alpha     = 1.0;
      realmFlash.lastRealm = realm.name;
    }
    if (realmFlash.alpha > 0) realmFlash.alpha -= dt * 0.55;

    recyclePlatforms();

    // Particle updates
    for (const d of dustParticles) {
      d.y -= d.speed * 60 * dt;
      if (d.y < -10) { d.y = LOGICAL_H + 10; d.x = Math.random() * LOGICAL_W; }
    }
    for (const o of neonOrbs) {
      o.x += o.dx * dt; o.y += o.dy * dt;
      if (o.x < 0 || o.x > LOGICAL_W) o.dx *= -1;
      if (o.y < 0 || o.y > LOGICAL_H) o.dy *= -1;
    }
    for (const s of starParticles) {
      s.alpha += s.dAlpha;
      if (s.alpha > 1 || s.alpha < 0) s.dAlpha *= -1;
    }
    for (const v of voidShapes) v.angle += v.dAngle;

    // Death
    if (player.y > cameraY + LOGICAL_H + 50) state = 'dead';
  }

  // Draw helpers
  function roundRect(cx, x, y, w, h, r) {
    cx.beginPath();
    cx.moveTo(x + r, y);
    cx.lineTo(x + w - r, y);
    cx.quadraticCurveTo(x + w, y, x + w, y + r);
    cx.lineTo(x + w, y + h - r);
    cx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    cx.lineTo(x + r, y + h);
    cx.quadraticCurveTo(x, y + h, x, y + h - r);
    cx.lineTo(x, y + r);
    cx.quadraticCurveTo(x, y, x + r, y);
    cx.closePath();
  }

  function wrapText(cx, text, x, y, maxW, lineH) {
    const words = text.split(' ');
    let line = '';
    for (let i = 0; i < words.length; i++) {
      const test = line + words[i] + ' ';
      if (cx.measureText(test).width > maxW && i > 0) {
        cx.fillText(line.trim(), x, y);
        line = words[i] + ' ';
        y   += lineH;
      } else {
        line = test;
      }
    }
    cx.fillText(line.trim(), x, y);
  }

  // Draw backgrounds
  function drawBackground(realmName) {
    if (realmName === 'EARTH') {
      ctx.fillStyle = '#0d0804';
      ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
      const g = ctx.createLinearGradient(0, 0, 0, LOGICAL_H);
      g.addColorStop(0, 'rgba(20,8,2,0.85)');
      g.addColorStop(1, 'rgba(40,20,5,0.4)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
      for (const d of dustParticles) {
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(180,120,60,${d.alpha})`;
        ctx.fill();
      }

    } else if (realmName === 'NEON') {
      ctx.fillStyle = '#060010';
      ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
      const g = ctx.createLinearGradient(0, 0, 0, LOGICAL_H);
      g.addColorStop(0, 'rgba(18,0,38,0.92)');
      g.addColorStop(1, 'rgba(38,0,58,0.7)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
      // Grid
      const gridOff = (cameraY * 0.08) % 40;
      ctx.save();
      ctx.lineWidth = 0.5;
      ctx.strokeStyle = 'rgba(160,32,240,0.14)';
      for (let x = 0; x < LOGICAL_W; x += 40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,LOGICAL_H); ctx.stroke(); }
      for (let y = -(gridOff); y < LOGICAL_H; y += 40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(LOGICAL_W,y); ctx.stroke(); }
      ctx.strokeStyle = 'rgba(0,245,255,0.08)';
      for (let x = 20; x < LOGICAL_W; x += 40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,LOGICAL_H); ctx.stroke(); }
      ctx.restore();
      // Orbs
      for (const o of neonOrbs) {
        const col = o.color === 'purple' ? [160,32,240] : [0,245,255];
        ctx.beginPath();
        ctx.arc(o.x, o.y, o.r * 3, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${col[0]},${col[1]},${col[2]},${o.alpha * 0.35})`;
        ctx.fill();
      }

    } else if (realmName === 'COSMIC') {
      ctx.fillStyle = '#000510';
      ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
      const g = ctx.createLinearGradient(0, 0, 0, LOGICAL_H);
      g.addColorStop(0, 'rgba(0,5,20,0.95)');
      g.addColorStop(1, 'rgba(5,10,40,0.8)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
      for (const s of starParticles) {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(200,220,255,${s.alpha})`;
        ctx.fill();
      }
      // Faint nebula
      ctx.save();
      ctx.globalAlpha = 0.06;
      const nb1 = ctx.createRadialGradient(100,180,0,100,180,140);
      nb1.addColorStop(0,'#4040ff'); nb1.addColorStop(1,'transparent');
      ctx.fillStyle = nb1; ctx.fillRect(0,0,LOGICAL_W,LOGICAL_H);
      const nb2 = ctx.createRadialGradient(300,420,0,300,420,110);
      nb2.addColorStop(0,'#ff40a0'); nb2.addColorStop(1,'transparent');
      ctx.fillStyle = nb2; ctx.fillRect(0,0,LOGICAL_W,LOGICAL_H);
      ctx.restore();

    } else {
      // VOID
      ctx.fillStyle = '#faf5e6';
      ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
      for (const v of voidShapes) {
        ctx.save();
        ctx.translate(v.x, v.y);
        ctx.rotate(v.angle);
        ctx.globalAlpha = v.alpha;
        ctx.strokeStyle = '#C9A84C';
        ctx.lineWidth = 1;
        const s = v.size;
        ctx.strokeRect(-s/2, -s/2, s, s);
        // inner diamond
        ctx.beginPath();
        ctx.moveTo(0, -s/4); ctx.lineTo(s/4, 0);
        ctx.lineTo(0, s/4);  ctx.lineTo(-s/4,0);
        ctx.closePath();
        ctx.stroke();
        ctx.restore();
      }
    }
  }

  function drawPlatforms() {
    for (const p of platforms) {
      if (p.y < cameraY - 20 || p.y > cameraY + LOGICAL_H + 20) continue;
      ctx.shadowBlur = p.moving ? 6 : 4;
      ctx.shadowColor = p.moving ? '#C9A84C' : 'rgba(255,255,255,0.3)';
      ctx.fillStyle = p.moving ? '#C9A84C' : '#ffffff';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      // tick marks
      ctx.shadowBlur = 0;
      ctx.fillStyle = p.moving ? 'rgba(0,0,0,0.28)' : 'rgba(0,0,0,0.15)';
      for (let nx = p.x + 8; nx < p.x + p.w - 4; nx += 14) {
        ctx.fillRect(nx, p.y + 3, 2, 4);
      }
    }
    ctx.shadowBlur = 0;
  }

  function drawPlayer(isVoid) {
    const flicker = 0.85 + 0.15 * Math.abs(Math.sin(flickerT * 3.7));
    ctx.save();
    ctx.globalAlpha = flicker;

    const px = player.x + player.w / 2;
    const py = player.y + player.h;
    const fw = player.w;
    const fh = player.h;

    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.bezierCurveTo(px - fw * 0.8, py - fh * 0.3, px - fw * 0.5, py - fh * 0.8, px, py - fh);
    ctx.bezierCurveTo(px + fw * 0.5, py - fh * 0.8, px + fw * 0.8, py - fh * 0.3, px, py);
    ctx.closePath();

    if (isVoid) {
      ctx.fillStyle   = '#1a1005';
      ctx.shadowColor = '#000000';
      ctx.shadowBlur  = 8;
    } else {
      const grad = ctx.createLinearGradient(px, py - fh, px, py);
      grad.addColorStop(0, '#fff8e0');
      grad.addColorStop(0.4, '#C9A84C');
      grad.addColorStop(1, '#8b5a00');
      ctx.fillStyle   = grad;
      ctx.shadowColor = '#C9A84C';
      ctx.shadowBlur  = 14;
    }
    ctx.fill();

    if (!isVoid) {
      // inner core highlight
      ctx.beginPath();
      ctx.moveTo(px, py - 4);
      ctx.bezierCurveTo(px - fw * 0.28, py - fh * 0.42, px - fw * 0.18, py - fh * 0.76, px, py - fh + 5);
      ctx.bezierCurveTo(px + fw * 0.18, py - fh * 0.76, px + fw * 0.28, py - fh * 0.42, px, py - 4);
      ctx.closePath();
      ctx.fillStyle = 'rgba(255,245,190,0.32)';
      ctx.shadowBlur = 0;
      ctx.fill();
    }
    ctx.restore();
  }

  // Main draw
  function draw() {
    ctx.clearRect(0, 0, LOGICAL_W, LOGICAL_H);

    if (state === 'start') {
      drawStartScreen();
    } else {
      const meters    = pxToMeters(Math.max(0, heightPx));
      const realm     = getRealmForMeters(meters);
      const isVoid    = realm.name === 'VOID';

      drawBackground(realm.name);

      // World-space draw
      ctx.save();
      ctx.translate(0, -cameraY);
      drawPlatforms();
      drawPlayer(isVoid);
      ctx.restore();

      // Realm ghost text
      if (realmFlash.alpha > 0) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, realmFlash.alpha);
        ctx.font = '54px "Bebas Neue", sans-serif';
        ctx.fillStyle = isVoid ? '#C9A84C' : '#ffffff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(realmFlash.name, LOGICAL_W / 2, LOGICAL_H / 2);
        ctx.restore();
      }

      if (state === 'dead') drawDeadOverlay(meters, isVoid);
    }
  }

  function drawStartScreen() {
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
    // faint grid
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.035)';
    ctx.lineWidth = 0.5;
    for (let x = 0; x < LOGICAL_W; x += 40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,LOGICAL_H); ctx.stroke(); }
    for (let y = 0; y < LOGICAL_H; y += 40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(LOGICAL_W,y); ctx.stroke(); }
    ctx.restore();

    // Subtitle label
    ctx.font = '11px "Outfit", sans-serif';
    ctx.fillStyle = '#E63946';
    ctx.textAlign = 'center';
    ctx.fillText('TRIAL 04 — GROWTH', LOGICAL_W / 2, 168);

    // Title
    ctx.font = '72px "Bebas Neue", sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.fillText('ASCENSION', LOGICAL_W / 2, 252);
    ctx.fillText('CLIMB', LOGICAL_W / 2, 318);

    // Gold bar
    ctx.fillStyle = '#C9A84C';
    ctx.fillRect(LOGICAL_W / 2 - 60, 332, 120, 2);

    // Instructions
    ctx.font = '13px "Outfit", sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    ctx.textAlign = 'center';
    ctx.fillText('TAP LEFT / RIGHT to move.', LOGICAL_W / 2, 378);
    ctx.fillText('Land on platforms. Don\'t fall.', LOGICAL_W / 2, 398);

    // Best
    if (bestM > 0) {
      ctx.font = '12px "Outfit", sans-serif';
      ctx.fillStyle = '#C9A84C';
      ctx.fillText('BEST: ' + bestM + 'm', LOGICAL_W / 2, 440);
    }

    // Mini flame
    const fx = LOGICAL_W / 2;
    const fy = 480;
    const fw2 = 14, fh2 = 20;
    ctx.save();
    ctx.globalAlpha = 0.85 + 0.15 * Math.abs(Math.sin(pulseT * 4));
    ctx.beginPath();
    ctx.moveTo(fx, fy + fh2 / 2);
    ctx.bezierCurveTo(fx - fw2*0.8, fy + fh2*0.2, fx - fw2*0.5, fy - fh2*0.3, fx, fy - fh2/2);
    ctx.bezierCurveTo(fx + fw2*0.5, fy - fh2*0.3, fx + fw2*0.8, fy + fh2*0.2, fx, fy + fh2/2);
    ctx.closePath();
    const fg = ctx.createLinearGradient(fx, fy - fh2/2, fx, fy + fh2/2);
    fg.addColorStop(0, '#fff8e0'); fg.addColorStop(0.5, '#C9A84C'); fg.addColorStop(1, '#8b5a00');
    ctx.fillStyle = fg;
    ctx.shadowColor = '#C9A84C'; ctx.shadowBlur = 10;
    ctx.fill();
    ctx.restore();

    // Pulse CTA
    const pulse = 0.5 + 0.5 * Math.sin(pulseT * 3);
    ctx.globalAlpha = 0.5 + 0.5 * pulse;
    ctx.font = '22px "Bebas Neue", sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.fillText('TAP TO BEGIN', LOGICAL_W / 2, 544);
    ctx.globalAlpha = 1;
  }

  function drawDeadOverlay(meters, isVoid) {
    const heart = getHeartType(meters);

    ctx.fillStyle = 'rgba(10,10,10,0.9)';
    ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);

    const baseY = LOGICAL_H * 0.14;

    // Red bar
    ctx.fillStyle = '#E63946';
    ctx.fillRect(0, baseY, LOGICAL_W, 3);

    ctx.font = '11px "Outfit", sans-serif';
    ctx.fillStyle = '#E63946';
    ctx.textAlign = 'center';
    ctx.fillText('YOU FELL', LOGICAL_W / 2, baseY - 10);

    // Height number
    ctx.font = '84px "Bebas Neue", sans-serif';
    ctx.fillStyle = '#C9A84C';
    ctx.textAlign = 'center';
    ctx.fillText(meters + 'm', LOGICAL_W / 2, baseY + 94);

    ctx.font = '12px "Outfit", sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.fillText('HEIGHT CLIMBED', LOGICAL_W / 2, baseY + 112);

    // Separator
    ctx.fillStyle = '#C9A84C';
    ctx.fillRect(LOGICAL_W / 2 - 40, baseY + 130, 80, 1);

    // Heart type
    ctx.font = '34px "Bebas Neue", sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.fillText(heart.name, LOGICAL_W / 2, baseY + 170);

    // Quote
    ctx.font = '13px "Outfit", sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.68)';
    ctx.textAlign = 'center';
    wrapText(ctx, '"' + heart.quote + '"', LOGICAL_W / 2, baseY + 196, 300, 19);

    // Best indicator
    const bY = baseY + 248;
    if (meters >= bestM) {
      ctx.font = '14px "Bebas Neue", sans-serif';
      ctx.fillStyle = '#C9A84C';
      ctx.fillText('NEW BEST!', LOGICAL_W / 2, bY);
    } else {
      ctx.font = '11px "Outfit", sans-serif';
      ctx.fillStyle = 'rgba(200,168,76,0.55)';
      ctx.fillText('Best: ' + bestM + 'm', LOGICAL_W / 2, bY);
    }

    // PLAY AGAIN button
    const btnW = 200, btnH = 48;
    const btnX = LOGICAL_W / 2 - btnW / 2;
    const btnY = bY + 20;
    ctx.fillStyle = '#E63946';
    roundRect(ctx, btnX, btnY, btnW, btnH, 5);
    ctx.fill();
    ctx.font = '20px "Bebas Neue", sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.fillText('PLAY AGAIN', LOGICAL_W / 2, btnY + 30);

    // Quiz link
    const qY = btnY + btnH + 24;
    ctx.font = '12px "Outfit", sans-serif';
    ctx.fillStyle = '#C9A84C';
    ctx.textAlign = 'center';
    ctx.fillText('TAKE THE FULL QUIZ \u2192', LOGICAL_W / 2, qY);

    // Store hit zones
    deadBtn  = { x: btnX, y: btnY, w: btnW, h: btnH };
    quizLink = { x: LOGICAL_W/2 - 90, y: qY - 14, w: 180, h: 20 };
  }

  // Game loop
  function loop(ts) {
    const dt  = Math.min((ts - lastTs) / 1000, 0.05);
    lastTs    = ts;
    pulseT   += dt;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(ts => { lastTs = ts; requestAnimationFrame(loop); });

  // Input helpers
  function updateKeys() {
    let L = false, R = false;
    for (const s of activeTouches.values()) {
      if (s === 'left')  L = true;
      if (s === 'right') R = true;
    }
    keys.left  = L;
    keys.right = R;
  }

  function handleOverlayClick(cx, cy) {
    if (deadBtn && cx >= deadBtn.x && cx <= deadBtn.x + deadBtn.w &&
        cy >= deadBtn.y && cy <= deadBtn.y + deadBtn.h) {
      startGame();
    } else if (quizLink && cx >= quizLink.x && cx <= quizLink.x + quizLink.w &&
               cy >= quizLink.y && cy <= quizLink.y + quizLink.h) {
      window.location.href = '/#quiz';
    }
  }

  function startGame() {
    keys.left = false; keys.right = false;
    activeTouches.clear();
    initGame();
    state = 'playing';
    scoreEl.textContent = '0';
  }

  // Touch
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    for (const t of e.changedTouches) {
      const cx = (t.clientX - rect.left) / scale;
      const cy = (t.clientY - rect.top)  / scale;
      if (state === 'start') {
        startGame();
        // Also register this touch as a directional input immediately
        activeTouches.set(t.identifier, cx < LOGICAL_W / 2 ? 'left' : 'right');
        updateKeys();
        continue;
      }
      if (state === 'dead') { handleOverlayClick(cx, cy); continue; }
      activeTouches.set(t.identifier, cx < LOGICAL_W / 2 ? 'left' : 'right');
    }
    updateKeys();
  }, { passive: false });

  canvas.addEventListener('touchend', e => {
    e.preventDefault();
    for (const t of e.changedTouches) activeTouches.delete(t.identifier);
    updateKeys();
  }, { passive: false });

  canvas.addEventListener('touchcancel', e => {
    e.preventDefault();
    for (const t of e.changedTouches) activeTouches.delete(t.identifier);
    updateKeys();
  }, { passive: false });

  // Mouse click (desktop)
  canvas.addEventListener('click', e => {
    const rect = canvas.getBoundingClientRect();
    const cx   = (e.clientX - rect.left) / scale;
    const cy   = (e.clientY - rect.top)  / scale;
    if (state === 'start') { startGame(); return; }
    if (state === 'dead')  { handleOverlayClick(cx, cy); }
  });

  // Keyboard
  document.addEventListener('keydown', e => {
    if ((state === 'start' || state === 'dead') && (e.code === 'Space' || e.code === 'Enter')) {
      startGame(); return;
    }
    if (e.code === 'ArrowLeft'  || e.code === 'KeyA') keys.left  = true;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
  });
  document.addEventListener('keyup', e => {
    if (e.code === 'ArrowLeft'  || e.code === 'KeyA') keys.left  = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
  });

})();
</script>
</body>
</html>
