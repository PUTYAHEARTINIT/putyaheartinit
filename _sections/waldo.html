<!-- ═══ FIND DESIRE — IMMERSIVE HEART WORLD ═══ -->
<section class="waldo-section" style="position:relative;overflow:hidden;border-top:1px solid rgba(255,255,255,0.04);">
 <div class="ctn" style="padding-top:100px;padding-bottom:32px;">
 <div class="rv">
 <p class="sec-label">The Hunt</p>
 <div class="sec-heading">FIND DESIRE</div>
 <p style="color:var(--cream2);font-size:14px;max-width:52ch;margin-top:16px;">Desire is hidden somewhere in this world — five times. Drag to explore, and click every glow you find.</p>
 </div>
 </div>
 <div class="ctn" style="padding-bottom:20px;">
 <div id="desireProgress" style="display:inline-flex;align-items:center;gap:10px;background:var(--black2);border:1px solid rgba(255,255,255,0.08);padding:10px 18px;font-family:'Outfit',sans-serif;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--cream2);">
   <span id="desireCount">0</span> <span>/ 5 found</span>
 </div>
 </div>
 <div class="waldo-wrap rv" style="position:relative;cursor:grab;overflow:hidden;max-height:600px;">
 <img src="images/pyhi-waldo.png" alt="PUTYAHEARTINIT World Find Your Heart" style="width:100%;min-width:1200px;display:block;transition:transform 0.1s;" id="waldoImg">
 <div id="desireLayer" style="position:absolute;inset:0;min-width:1200px;width:100%;pointer-events:none;"></div>
 <div style="position:absolute;inset:0;background:linear-gradient(transparent 70%,var(--black2));pointer-events:none;"></div>
 <div style="position:absolute;bottom:24px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--white);opacity:0.6;pointer-events:none;">&#8592; Drag to Explore &#8594;</div>
 </div>
 <div class="ctn" style="padding:40px 40px 100px;">
 <div id="desireComplete" style="display:none;border:1px solid var(--red);background:rgba(255,0,64,0.06);padding:32px;text-align:center;">
   <div style="font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:var(--white);margin-bottom:8px;">YOU FOUND DESIRE</div>
   <p style="color:var(--cream2);font-size:13px;">All five hearts, found. That's the whole point — planning heart initiates happiness internally.</p>
 </div>
 </div>
</section>
