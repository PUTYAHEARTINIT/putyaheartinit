<!-- SIZE SELECTOR MODAL -->
<div id="sizeModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:10000;align-items:center;justify-content:center;">
 <div style="background:var(--black2);border:1px solid rgba(255,255,255,0.1);padding:48px;max-width:500px;width:90%;position:relative;">
 <button id="closeModal" style="position:absolute;top:16px;right:16px;background:none;border:none;color:var(--gray);font-size:24px;cursor:pointer;padding:8px;transition:color 0.3s;">&times;</button>
 <h3 id="modalProductName" style="font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:3px;color:var(--white);margin-bottom:8px;"></h3>
 <p id="modalProductPrice" style="font-size:18px;color:var(--gray);margin-bottom:32px;"></p>
 <p style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gray);margin-bottom:16px;">Select Size:</p>
 <div id="sizeButtons" style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px;"></div>
 <p style="font-size:10px;color:var(--gray2);margin-top:24px;text-align:center;">💰 $20 shipping • Free over $250</p>
 </div>
</div>
